version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: footguard-db
    restart: always
    environment:
      POSTGRES_USER: footguard
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: footguard
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    networks:
      - footguard-net

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: footguard-ai
    restart: always
    networks:
      - footguard-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: footguard-backend
    restart: always
    depends_on:
      - postgres
      - ai-service
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://footguard:${DB_PASSWORD}@postgres:5432/footguard?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_ORIGIN: ${DOMAIN_URL}
      AI_SERVICE_URL: "http://ai-service:8000"
      UPLOAD_DIR: "/app/uploads"
      AI_MODEL_VERSION: "best_model.pth"
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - footguard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${DOMAIN_URL}
    container_name: footguard-frontend
    restart: always
    networks:
      - footguard-net

  nginx:
    image: nginx:alpine
    container_name: footguard-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt
    depends_on:
      - frontend
      - backend
    networks:
      - footguard-net

networks:
  footguard-net:
    driver: bridge

volumes:
  pgdata:
  backend-uploads:
  certs:
